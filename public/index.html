<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>事故報告フォーム</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- LIFF SDK追加 -->
    <script defer charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script defer src="script.js"></script>
</head>
<body>
    <!-- ローディング画面 -->
    <div id="loader" class="loader-overlay hidden">
        <div class="loader"></div>
        <p id="loader-text" class="loader-text">処理中です...</p>
    </div>

    <!-- メインコンテンツ -->
    <div class="container">
        <form id="report-form" novalidate>
            <h2>事故報告</h2>

            <!-- LINE連携状態表示 -->
            <div id="line-status" class="line-status hidden">
                <div class="line-status-content">
                    <i class="fab fa-line line-icon"></i>
                    <span id="line-status-text">LINE連携を確認中...</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">1. 連絡状況</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="type1" name="type" value="警察・保険会社両方に連絡済" required>
                        <label for="type1">警察・保険会社両方に連絡済</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="type2" name="type" value="警察のみ連絡済">
                        <label for="type2">警察のみ連絡済</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="type3" name="type" value="保険会社のみ連絡済">
                        <label for="type3">保険会社のみ連絡済</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="type4" name="type" value="まだ警察・保険会社に連絡していない">
                        <label for="type4">まだ警察・保険会社に連絡していない</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="type-other" name="type" value="その他">
                        <label for="type-other">その他</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="details" class="form-label">
                    詳細（１００文字まで）
                    <span class="label-note" id="details-required-note"></span>
                </label>
                <textarea id="details" name="details" rows="4" placeholder="例：直径20cm程度の穴ぼこ" maxlength="100"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">
                    3. 現場の写真（車のナンバー等は写さない)
                    <span class="label-note" id="photo-required-note">（必須 - 遠景・近景の両方をアップロード）</span>
                </label>
                
                <!-- 遠景写真 -->
                <div class="photo-section" style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #555;">写真(遠景)</label>
                    <div class="photo-controls">
                        <button type="button" id="btn-album-distant" class="button-like-input album-btn">
                            <i class="fas fa-images"></i> アルバムから選択
                        </button>
                        <button type="button" id="btn-camera-distant" class="button-like-input camera-btn">
                            <i class="fas fa-camera"></i> カメラを起動
                        </button>
                        <input type="file" id="photo-distant" name="photo-distant" accept="image/*" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; opacity: 0;">
                    </div>
                    <img id="image-preview-distant" src="#" alt="遠景写真プレビュー"/>
                </div>

                <!-- 近景写真 -->
                <div class="photo-section">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #555;">写真(近景)</label>
                    <div class="photo-controls">
                        <button type="button" id="btn-album-close" class="button-like-input album-btn">
                            <i class="fas fa-images"></i> アルバムから選択
                        </button>
                        <button type="button" id="btn-camera-close" class="button-like-input camera-btn">
                            <i class="fas fa-camera"></i> カメラを起動
                        </button>
                        <input type="file" id="photo-close" name="photo-close" accept="image/*" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; opacity: 0;">
                    </div>
                    <img id="image-preview-close" src="#" alt="近景写真プレビュー"/>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">4. 現場の場所</label>
                <div id="map-wrapper">
                    <div id="map"></div>
                    <i id="center-pin" class="fas fa-map-marker-alt"></i>
                </div>
                <div id="coords-display">地図を動かして位置を合わせてください</div>
                <input type="hidden" id="latitude" name="latitude" required>
                <input type="hidden" id="longitude" name="longitude" required>
                <!-- LINEアクセストークン用の隠しフィールド -->
                <input type="hidden" id="accessToken" name="accessToken">
                <input type="hidden" id="userId" name="userId">
            </div>

            <button type="submit" id="btn-submit" disabled>連絡状況を選択してください</button>
        </form>
    </div>
</body>
</html>
